name: Preview

# Déploie une branche sur un environnement de préversion (emplacement
# « staging » de l'App Service, ou une seconde App Service), à une autre
# adresse que la production : on vérifie en ligne avant de fusionner dans
# main. Mise en route : docs/preview.md.
#
# La préversion n'est jamais indexée (robots.txt fermé, X-Robots-Tag), porte
# un badge avec la branche et le commit, et a sa propre clé PostHog.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Une seule préversion à la fois : la dernière poussée l'emporte.
concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  # Rien à déployer tant que l'environnement n'est pas configuré (ou pour une
  # pull request venue d'un fork, qui n'a pas accès aux secrets).
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          PROFILE: ${{ secrets.AZURE_PREVIEW_PUBLISH_PROFILE }}
          PREVIEW_URL: ${{ vars.PREVIEW_URL }}
        run: |
          if [ -z "$PROFILE" ] || [ -z "$PREVIEW_URL" ]; then
            echo "::notice::Préversion non configurée : secret AZURE_PREVIEW_PUBLISH_PROFILE ou variable PREVIEW_URL absents (docs/preview.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Garde-fou : le profil de la production ne doit jamais servir ici.
          if echo "$PROFILE" | grep -q 'publishUrl="industryx0\.scm\.azurewebsites\.net'; then
            echo "::error::AZURE_PREVIEW_PUBLISH_PROFILE est le profil de la production. Utiliser celui de l'emplacement staging."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    # Lien « View deployment » sur la pull request.
    environment:
      name: preview
      url: ${{ vars.PREVIEW_URL }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # Historique complet, comme deploy.yml (dates du sitemap).
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preview label
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: echo "NEXT_PUBLIC_PREVIEW_LABEL=${BRANCH} · ${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_ENV: preview
          # Liens absolus (canonical, partage, sitemap) vers la préversion.
          NEXT_PUBLIC_SITE_URL: ${{ vars.PREVIEW_URL }}
          # Clé PostHog distincte : les visites de test ne polluent pas la production.
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY_PREVIEW }}
          # Pas de GA4 en préversion.
          SANITY_PROJECT_ID: tudyxwtm
          SANITY_DATASET: production

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Create deployment package
        run: |
          rm -f release.zip
          zip -r release.zip .next public package.json package-lock.json next.config.mjs node_modules -x "*.git*"

      - name: Deploy to the preview environment
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.PREVIEW_APP_NAME || 'industryx0' }}
          slot-name: ${{ vars.PREVIEW_SLOT || 'staging' }}
          publish-profile: ${{ secrets.AZURE_PREVIEW_PUBLISH_PROFILE }}
          package: release.zip
          clean: true
          restart: true
