name: Deploy to Azure App Service

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Clean install dependencies
        run: |
          rm -rf node_modules
          npm cache clean --force
          npm ci

      - name: Inspect Next.js installation
        run: |
          echo "Next.js version:"
          node -p "require('./node_modules/next/package.json').version"

          echo "Next.js package location:"
          node -p "require.resolve('next/package.json')"

          echo "Checking Next.js server directory:"
          ls -la node_modules/next/server | head -50

      - name: Build
        run: npm run build

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Create deployment package
        run: |
          rm -f release.zip

          zip -r release.zip \
            .next \
            public \
            package.json \
            package-lock.json \
            next.config.mjs \
            node_modules \
            -x "*.git*"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: industryx0
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
          clean: true
          restart: true
